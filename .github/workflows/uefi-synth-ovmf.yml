# Boots the flite-freestanding `synth` EFI app under QEMU + OVMF and confirms it
# synthesizes "hello world" and writes hello.wav from inside the UEFI firmware
# environment. The produced WAV must be byte-for-byte identical to the checked-in
# golden reference (freestanding-port/tests/golden/hello.wav).
#
# The job runs across a matrix of QEMU's two Intel HDA controller models. The HDA
# device is attached but not yet used by the firmware app (output is a WAV file,
# UEFI has no standard audio protocol) — the matrix exists so a later audio
# expansion can drive real playback through each controller without reworking CI.
#
# Determinism note: synthesis output is fully deterministic — flite's rand() is a
# fixed-seed LCG, all floating-point math is performed by the pinned `libm` crate
# (via Cargo.lock) and IEEE-exact soft-float libcalls from `compiler_builtins`.
# clang/LLVM only emits those libcalls in source order and does not do the
# arithmetic, so the bytes reproduce across (unpinned) toolchain versions. If a
# future runner image ever diverges, pin clang/LLVM + the nightly date and
# regenerate the golden file.

name: UEFI synth (OVMF)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synth-wav:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # QEMU's two Intel HDA controller emulations (ICH6 and ICH9).
        hda: [intel-hda, ich9-intel-hda]

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (clang/LLVM, QEMU, OVMF)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 llvm-19 qemu-system-x86 ovmf python3

      - name: Install Rust nightly + UEFI target
        run: |
          rustup toolchain install nightly --profile minimal
          rustup target add --toolchain nightly x86_64-unknown-uefi

      - name: Generate compile_commands.json
        working-directory: freestanding-port
        run: |
          # Generate the compilation DB fresh for this checkout (correct absolute
          # paths) rather than relying on a committed copy. See DEVELOPER_GUIDE.md.
          make compile-commands

      - name: Build COFF archive + synth.efi
        working-directory: freestanding-port
        run: |
          make synth CLANG=clang-19 COFF_AR=llvm-ar-19

      - name: Run the QEMU + OVMF test (HDA ${{ matrix.hda }})
        working-directory: freestanding-port
        run: |
          # Boots synth.efi, asserts it writes hello.wav, and checks the result is
          # bit-identical to tests/golden/hello.wav. OVMF paths are auto-detected.
          ./tests/run-qemu-test.sh "${{ matrix.hda }}"
